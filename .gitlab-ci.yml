image: "python:3.7"

variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

stages:
  - lint
  - test
  - document

flake8:
  stage: lint
  allow_failure: true
  script:
    - pip install flake8 flake8-junit-report
    - retval=0
    - flake8 --output-file flake8.txt ai2t/ || retval=$?
    - flake8_junit flake8.txt flake8_junit.xml
    - cat flake8.txt
    - exit "$retval"
  artifacts:
    when: always
    reports:
      junit: flake8_junit.xml
  tags:
    - base

coverage:
  stage: test
  allow_failure: true
  script:
    - pip install -r requirements.txt --exists-action w
    - pip install -r test-requirements.txt
    - retval=0
    - coverage run --source ai2t -m pytest || retval=$?
    - coverage html -d coverage
    - coverage report
    - exit "$retval"
  coverage: '/\d+\%\s*$/'
  artifacts:
    paths:
      - coverage
  tags:
    - base

pytest:
  stage: test
  allow_failure: false
  script:
    - pip install -r requirements.txt --exists-action w
    - pip install -r test-requirements.txt
    - python -m pytest
  artifacts:
    when: always
    reports:
      junit: output.xml
  tags:
    - base

sphinx:
  stage: document
  dependencies:
    - pytest
  script:
    - pip install -r requirements.txt --exists-action w
    - pip install -r docs/doc-requirements.txt
    - apt-get update
    - apt-get install make
    - cd docs
    - make html
    - mv _build/html/ ../sphinx
  artifacts:
    paths:
      - sphinx
  tags:
    - base
  only:
    - master
