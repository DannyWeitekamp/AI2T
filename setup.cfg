[metadata]
name = ai2t
author = Daniel Weitekamp, Christopher J. MacLellan, Erik Harpstead
author-email = dannyweitekamp@gmail.com, maclellan.christopher@gmail.com, whitill29@gmail.com 
summary = A framework for creating AI2T agents that learn from demonstrations and feedback.
description-file = README.md
description-content-type = text/markdown; charset=UTF-8
home-page = https://github.com/DannyWeitekamp/AI2T
project_urls = 
    Source Code = https://github.com/DannyWeitekamp/AI2T
license = MIT
license_file = LICENSE
classifier =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Artificial Intelligence
    License :: OSI Approved :: MIT License
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10

[files]
package =
    ai2t

[bdist_wheel]
universal=1
